<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0c1e2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keepy-uppy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Keepy-uppy – Digital FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1e2c;
  --ink: #ffffff;
  --muted: #8fa3b2;
  --accent: #3cc3c4;
  --accent-ink: #0c1e2c;
  --tier: #ac9372;
  --tier-ink: #ffffff;
  --card: #ffffff;
  --card-ink: #0c1e2c;
  --card-muted: #5f6f7a;
  --pill: #5ecacc;
  --pill-ink: #ffffff;
  --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --card: #162f44;
    --card-ink: #ffffff;
    --card-muted: #9db0bd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --card: #162f44;
  --card-ink: #ffffff;
  --card-muted: #9db0bd;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body { font-family: var(--font); color: var(--ink); }
#game { position: fixed; inset: 0; width: 100vw; height: 100%; display: block; }

.top {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 16px; right: 16px;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  pointer-events: none;
}
.crest { width: 36px; height: 40px; display: block; }
.crest img { width: 100%; height: 100%; object-fit: contain; }
.club { text-align: center; font-weight: 600; font-size: 17px; letter-spacing: 0.01em; }
.hud {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.tier {
  background: var(--tier);
  color: var(--tier-ink);
  font-weight: 600;
  font-size: 14px;
  padding: 5px 16px;
  border-radius: 8px;
}
.score {
  font-weight: 800;
  font-size: clamp(76px, 25vw, 132px);
  line-height: 0.95;
  letter-spacing: -0.04em;
  transition: transform 0.08s ease-out;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
}
.score.bump { transform: scale(1.1); }
.best { font-weight: 600; font-size: 14px; color: var(--muted); }
.wind {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  right: 16px;
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  border: 1.5px solid var(--accent);
  border-radius: 8px;
  padding: 4px 10px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.wind.on { opacity: 1; }
.toast {
  position: fixed;
  left: 0; right: 0;
  top: 44%;
  text-align: center;
  font-weight: 800;
  font-size: 28px;
  color: var(--accent);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  opacity: 0;
  pointer-events: none;
}
.toast.show { animation: pop 0.9s ease-out; }
@keyframes pop {
  0% { opacity: 0; transform: translateY(10px) scale(0.92); }
  15% { opacity: 1; transform: translateY(0) scale(1.04); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-22px); }
}
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 24px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: linear-gradient(to top, rgba(12, 30, 44, 0.75), rgba(12, 30, 44, 0) 60%);
}
.overlay[hidden] { display: none; }
.card {
  width: 100%;
  max-width: 380px;
  background: var(--card);
  color: var(--card-ink);
  border-radius: 18px;
  padding: 20px 20px 18px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}
.pill {
  display: inline-block;
  background: var(--pill);
  color: var(--pill-ink);
  font-weight: 700;
  font-size: 13px;
  padding: 3px 10px;
  border-radius: 6px;
  margin-bottom: 12px;
}
.card h1 { font-weight: 700; font-size: 24px; line-height: 1.2; margin: 0 0 8px; }
.card p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: var(--card-muted); }
.result { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px; }
.result .big { font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: -0.03em; }
.result span { font-weight: 600; font-size: 16px; color: var(--card-muted); }
.card button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  font: 700 17px var(--font);
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
}
.card button:focus-visible { outline: 3px solid var(--tier); outline-offset: 3px; }
.card button.secondary {
  margin-top: 10px;
  background: transparent;
  color: var(--card-ink);
  box-shadow: inset 0 0 0 1.5px var(--card-muted);
}
.card button.link {
  width: auto;
  padding: 0;
  background: none;
  color: var(--accent);
  font: 600 14px var(--font);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.card p.sub { margin: -8px 0 16px; font-size: 14px; }
.card p.sub b { color: var(--card-ink); }
.nick { margin: 0 0 16px; }
.nick label { display: block; font-size: 14px; font-weight: 600; color: var(--card-muted); margin-bottom: 8px; }
.nick .row { display: flex; gap: 8px; }
.nick input {
  flex: 1;
  min-width: 0;
  font: 600 17px var(--font);
  padding: 12px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--card-muted);
  background: transparent;
  color: var(--card-ink);
  -webkit-user-select: text;
  user-select: text;
  touch-action: manipulation;
}
.nick input:focus { outline: none; border-color: var(--accent); }
.nick .row button { width: auto; padding: 12px 18px; font-size: 16px; }
#lb { background: rgba(12, 30, 44, 0.6); }
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  margin-bottom: 10px;
  border-radius: 12px;
  background: rgba(127, 140, 150, 0.16);
}
.card .tabs button {
  padding: 9px 6px;
  border-radius: 9px;
  font-size: 14px;
  background: transparent;
  color: var(--card-muted);
}
.card .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.lb-list {
  list-style: none;
  margin: 0 0 14px;
  padding: 0;
  max-height: min(48vh, 420px);
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}
.lb-list li {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 8px;
  border-bottom: 1px solid rgba(127, 140, 150, 0.2);
  font-size: 15px;
}
.lb-list li.me { background: rgba(60, 195, 196, 0.16); border-radius: 10px; border-bottom-color: transparent; }
.lb-list .rank { font-weight: 700; color: var(--card-muted); text-align: right; }
.lb-list .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-list .val { font-weight: 800; font-size: 17px; }
.lb-list li.status { display: block; border: 0; color: var(--card-muted); text-align: center; padding: 18px 8px; }
#install .card { max-height: calc(100vh - 48px); overflow-y: auto; }
#install .card h1 { font-size: 21px; }
#install .card p { margin-bottom: 14px; font-size: 14px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li {
  display: grid;
  grid-template-columns: 24px 1fr 24px;
  gap: 10px;
  align-items: center;
  padding: 9px 0;
  border-top: 1px solid rgba(127, 140, 150, 0.2);
  font-size: 14px;
  line-height: 1.4;
}
.steps li b { font-weight: 700; }
.steps .num {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(60, 195, 196, 0.2);
  font-weight: 700;
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.steps svg { width: 22px; height: 22px; color: var(--card-muted); }
#instOk { margin-top: 12px; }
#instInstallBtn { margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
#instInstallBtn[hidden] { display: none; }
#instInstallBtn svg { width: 20px; height: 20px; flex: none; }
.card button.ghost { background: none; color: var(--card-muted); font: 600 14px var(--font); padding: 10px; margin-top: 4px; }
@media (prefers-reduced-motion: reduce) {
  .score { transition: none; }
  .toast.show { animation-duration: 1.4s; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="top">
  <div class="crest" id="crest"></div>
  <div class="club" id="club"></div>
  <div></div>
</div>
<div class="hud">
  <div class="tier" id="tier"></div>
  <div class="score" id="score">0</div>
  <div class="best" id="best"></div>
</div>
<div class="wind" id="wind"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="start">
  <div class="card">
    <div class="pill" id="startPill"></div>
    <h1 id="startTitle"></h1>
    <p id="startText"></p>
    <button id="startBtn"></button>
    <button class="secondary lb-open" id="lbStartBtn" hidden></button>
  </div>
</div>

<div class="overlay" id="install" hidden>
  <div class="card">
    <div class="pill" id="instPill"></div>
    <h1 id="instTitle"></h1>
    <p id="instText"></p>
    <div class="tabs" role="tablist">
      <button role="tab" id="instTabIos" aria-selected="true"></button>
      <button role="tab" id="instTabAndroid" aria-selected="false"></button>
    </div>
    <button id="instInstallBtn" hidden></button>
    <ol class="steps" id="instSteps"></ol>
    <button id="instOk"></button>
    <button class="ghost" id="instSkip"></button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="pill" id="overPill"></div>
    <div class="result"><div class="big" id="finalScore">0</div><span id="finalUnit"></span></div>
    <p id="overInfo"></p>
    <form class="nick" id="nickBox" hidden>
      <label for="nickInput" id="nickLabel"></label>
      <div class="row">
        <input id="nickInput" maxlength="20" autocomplete="nickname" autocapitalize="words" enterkeyhint="done" spellcheck="false">
        <button type="submit" id="nickSave"></button>
      </div>
    </form>
    <p class="sub" id="submitInfo" hidden></p>
    <button id="againBtn"></button>
    <button class="secondary lb-open" id="lbOverBtn" hidden></button>
  </div>
</div>

<div class="overlay" id="lb" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <div class="pill" id="lbTitle"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabScore" aria-selected="true"></button>
      <button role="tab" id="tabStreak" aria-selected="false"></button>
    </div>
    <ol class="lb-list" id="lbList"></ol>
    <button id="lbClose"></button>
  </div>
</div>

  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--bg', BRAND.colors.bg);
  rootStyle.setProperty('--accent', BRAND.colors.accent);
  rootStyle.setProperty('--tier', BRAND.colors.tier);

  const T = BRAND.text;
  $('club').textContent = BRAND.clubName;
  $('startPill').textContent = T.startPill;
  $('startTitle').textContent = T.startTitle;
  $('startText').textContent = T.startText;
  $('startBtn').textContent = T.startBtn;
  $('againBtn').textContent = T.again;
  $('finalUnit').textContent = T.unit;

  if (BRAND.crestImage) {
    const img = new Image();
    img.src = BRAND.crestImage;
    img.alt = BRAND.clubName;
    $('crest').appendChild(img);
  } else {
    $('crest').innerHTML =
      '<svg viewBox="0 0 36 40" width="36" height="40" aria-label="' + BRAND.clubName + '">' +
      '<path d="M18 2 L33 7 V19 C33 29 26 35 18 38 C10 35 3 29 3 19 V7 Z" fill="none" stroke="' + BRAND.colors.accent + '" stroke-width="2"/>' +
      '<text x="18" y="23" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="9.5" fill="' + BRAND.colors.accent + '">' + BRAND.initials + '</text></svg>';
  }

  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = $('score'), bestEl = $('best'), tierEl = $('tier');
  const windEl = $('wind'), toastEl = $('toast');
  const startEl = $('start'), overEl = $('over');

  const stadium = new Image();
  let stadiumReady = false;
  stadium.onload = () => { stadiumReady = true; };
  stadium.src = BRAND.stadiumImage;

  let W = 0, H = 0, dpr = 1;
  let state = 'menu';
  let ball, score, level, streak, bestStreak, wind, lastHit, groundY, gravityBase;
  let best = 0;
  try { best = parseInt(localStorage.getItem('dekazas-dfc-best') || '0', 10) || 0; } catch (e) { best = 0; }

  function showBest() { bestEl.textContent = T.best + ': ' + best; }
  function showTier() { tierEl.textContent = BRAND.levels[Math.min(level, BRAND.levels.length - 1)]; }
  showBest();

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H - Math.max(56, H * 0.09);
    gravityBase = H * 1.5;
    if (ball) ball.x = Math.min(Math.max(ball.x, ball.r), W - ball.r);
  }
  window.addEventListener('resize', resize);
  resize();

  function baseRadius() { return Math.min(W, H) * 0.085; }
  function restY() { return groundY - baseRadius() - H * 0.2; }

  function reset() {
    score = 0; level = 0; streak = 0; bestStreak = 0; wind = 0; lastHit = 0;
    ball = { x: W / 2, y: restY(), vx: 0, vy: 0, r: baseRadius(), spinX: 0 };
    scoreEl.textContent = '0';
    windEl.classList.remove('on');
    showTier();
  }
  reset();

  function gravity() { return gravityBase * (1 + level * 0.09); }

  function setLevel(n) {
    level = n;
    ball.r = baseRadius() * Math.max(0.6, 1 - level * 0.07);
    showTier();
    if (level >= 3) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      wind = dir * Math.min(0.06 + (level - 3) * 0.025, 0.18) * W;
      windEl.textContent = dir < 0 ? T.windLeft : T.windRight;
      windEl.classList.add('on');
    } else {
      wind = 0;
      windEl.classList.remove('on');
    }
  }

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
  }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  function kick(px, py) {
    const now = performance.now();
    if (now - lastHit < 110) return false;
    const dx = px - ball.x, dy = py - ball.y;
    const hitR = ball.r * 1.7;
    if (dx * dx + dy * dy > hitR * hitR) return false;
    lastHit = now;

    const offset = Math.max(-1, Math.min(1, dx / ball.r));
    const apex = H * (0.5 + Math.random() * 0.06);
    ball.vy = -Math.sqrt(2 * gravity() * apex);
    ball.vx = -offset * W * 0.95 + ball.vx * 0.25;
    ball.spinX = (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 2.5);

    score++;
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 90);

    if (Math.abs(offset) < 0.22) {
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      if (streak >= 2) toast(T.perfect + ' ×' + streak);
      buzz(18);
    } else {
      streak = 0;
      buzz(10);
    }

    if (score % 10 === 0) {
      setLevel(level + 1);
      toast(level === 3 ? T.windOn : BRAND.levels[Math.min(level, BRAND.levels.length - 1)]);
    }
    return true;
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state === 'ready') { if (kick(e.clientX, e.clientY)) state = 'play'; }
    else if (state === 'play') kick(e.clientX, e.clientY);
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (e.target.closest && e.target.closest('.lb-list')) return; // a ranglista görgethető
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());

  function begin() {
    reset();
    startEl.hidden = true;
    overEl.hidden = true;
    state = 'ready';
    toast(T.tap);
  }
  $('startBtn').addEventListener('click', begin);
  $('againBtn').addEventListener('click', begin);

  /* ---------- közös ranglista ---------- */
  const lbOn = !!(LEADERBOARD.supabaseUrl && LEADERBOARD.supabaseKey);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let nick = store.get('keepy-nick') || '';
  let deviceId = store.get('keepy-device');
  if (!deviceId) {
    deviceId = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
    store.set('keepy-device', deviceId);
  }
  function loadQueue() { try { return JSON.parse(store.get('keepy-queue') || '[]'); } catch (e) { return []; } }
  function saveQueue(q) { store.set('keepy-queue', JSON.stringify(q.slice(-100))); }

  function api(path, opts) {
    opts = opts || {};
    const key = LEADERBOARD.supabaseKey;
    const headers = Object.assign({ apikey: key, 'Content-Type': 'application/json' }, opts.headers || {});
    if (key.indexOf('sb_') !== 0) headers.Authorization = 'Bearer ' + key; // régi (JWT) anon key
    return fetch(LEADERBOARD.supabaseUrl.replace(/\/+$/, '').replace(/\/rest\/v1$/, '') + '/rest/v1/' + path, Object.assign({}, opts, { headers }))
      .then((r) => { if (!r.ok) { const err = new Error('HTTP ' + r.status); err.status = r.status; throw err; } return r; });
  }

  // A még be nem küldött eredményeket egyben küldi el. 'none' | 'ok' | 'fail'
  let flushing = null;
  function flush() {
    if (!lbOn || !nick) return Promise.resolve('none');
    if (flushing) return flushing;
    const q = loadQueue();
    if (!q.length) return Promise.resolve('none');
    const rows = q.map((e) => ({ nickname: nick, score: e.s, streak: Math.min(e.k, e.s), device_id: deviceId }));
    flushing = api('scores', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rows) })
      .then(() => { saveQueue(loadQueue().slice(q.length)); return 'ok'; })
      .catch((err) => {
        // hibás adat (400) soha nem menne át – eldobjuk, hogy ne akadjon el a sor
        if (err.status === 400) saveQueue(loadQueue().slice(q.length));
        return 'fail';
      })
      .finally(() => { flushing = null; });
    return flushing;
  }

  const nickBox = $('nickBox'), nickInput = $('nickInput'), submitInfo = $('submitInfo');
  const lbEl = $('lb'), lbList = $('lbList'), tabScore = $('tabScore'), tabStreak = $('tabStreak');
  $('nickLabel').textContent = T.nickLabel;
  nickInput.placeholder = T.nickPlaceholder;
  $('nickSave').textContent = T.nickSave;
  $('lbTitle').textContent = T.leaderboard;
  tabScore.textContent = T.mostPoints;
  tabStreak.textContent = T.perfectStreak;
  $('lbClose').textContent = T.close;
  document.querySelectorAll('.lb-open').forEach((b) => {
    b.textContent = T.leaderboard;
    b.hidden = !lbOn;
    b.addEventListener('click', openLeaderboard);
  });

  function showSubmitInfo(prefix, suffix) {
    submitInfo.textContent = prefix + ' ';
    const b = document.createElement('b');
    b.textContent = nick;
    submitInfo.appendChild(b);
    submitInfo.appendChild(document.createTextNode(suffix ? ' – ' + suffix + ' ' : ' · '));
    const change = document.createElement('button');
    change.type = 'button';
    change.className = 'link';
    change.textContent = T.change;
    change.addEventListener('click', () => {
      submitInfo.hidden = true;
      nickInput.value = nick;
      nickBox.hidden = false;
      nickInput.focus();
      nickInput.select();
    });
    submitInfo.appendChild(change);
    submitInfo.hidden = false;
  }

  function refreshOverLeaderboard() {
    if (!lbOn) return;
    if (!nick) {
      submitInfo.hidden = true;
      nickBox.hidden = false;
      return;
    }
    nickBox.hidden = true;
    if (!loadQueue().length) { showSubmitInfo(T.playingAs); return; }
    showSubmitInfo(T.submitting);
    flush().then((res) => {
      if (overEl.hidden || !nickBox.hidden) return;
      if (res === 'ok') showSubmitInfo(T.submitted);
      else if (res === 'fail') showSubmitInfo(T.playingAs, T.offline);
      else showSubmitInfo(T.playingAs);
    });
  }

  nickBox.addEventListener('submit', (e) => {
    e.preventDefault();
    const v = nickInput.value.replace(/\s+/g, ' ').trim().slice(0, 20);
    if (!v) { nickInput.focus(); return; }
    nick = v;
    store.set('keepy-nick', nick);
    nickInput.blur();
    refreshOverLeaderboard();
  });

  function recordResult(s, k) {
    if (!lbOn || s <= 0) return;
    const q = loadQueue();
    q.push({ s: s, k: k, t: Date.now() });
    saveQueue(q);
  }

  let lbTab = 'score', lbReq = 0;
  function lbStatus(text) {
    lbList.textContent = '';
    const li = document.createElement('li');
    li.className = 'status';
    li.textContent = text;
    lbList.appendChild(li);
  }
  function renderLeaderboard() {
    const req = ++lbReq;
    const col = lbTab === 'score' ? 'score' : 'streak';
    tabScore.setAttribute('aria-selected', String(lbTab === 'score'));
    tabStreak.setAttribute('aria-selected', String(lbTab === 'streak'));
    lbStatus(T.loading);
    flush()
      // a 10 legjobb játék – ugyanaz a játékos többször is szerepelhet
      .then(() => api('scores?select=nickname,' + col + (col === 'streak' ? '&streak=gt.0' : '') +
        '&order=' + col + '.desc,created_at.asc&limit=10'))
      .then((r) => r.json())
      .then((rows) => {
        if (req !== lbReq) return;
        if (!rows.length) { lbStatus(T.empty); return; }
        lbList.textContent = '';
        const me = nick.toLowerCase();
        let meEl = null;
        rows.forEach((row, i) => {
          const li = document.createElement('li');
          const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = i + 1;
          const name = document.createElement('span'); name.className = 'name'; name.textContent = row.nickname;
          const val = document.createElement('span'); val.className = 'val'; val.textContent = row[col];
          li.append(rank, name, val);
          if (me && row.nickname.toLowerCase() === me) { li.className = 'me'; meEl = li; }
          lbList.appendChild(li);
        });
        lbList.scrollTop = 0;
        if (meEl && meEl.offsetTop > lbList.clientHeight) meEl.scrollIntoView({ block: 'center' });
      })
      .catch(() => { if (req === lbReq) lbStatus(T.loadError); });
  }
  function openLeaderboard() {
    lbEl.hidden = false;
    renderLeaderboard();
    $('lbClose').focus();
  }
  function closeLeaderboard() {
    lbEl.hidden = true;
    (overEl.hidden ? $('startBtn') : $('againBtn')).focus();
  }
  tabScore.addEventListener('click', () => { lbTab = 'score'; renderLeaderboard(); });
  tabStreak.addEventListener('click', () => { lbTab = 'streak'; renderLeaderboard(); });
  $('lbClose').addEventListener('click', closeLeaderboard);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lbEl.hidden) closeLeaderboard(); });
  window.addEventListener('online', () => flush());
  flush();

  /* ---------- telepítési útmutató (főképernyőre tétel) ---------- */
  const ua = navigator.userAgent || '';
  const isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  const isStandalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const installEl = $('install'), instSteps = $('instSteps'), instInstallBtn = $('instInstallBtn');
  const instTabIos = $('instTabIos'), instTabAndroid = $('instTabAndroid');
  const svg = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const ICON = {
    share: svg('<path d="M8 10H6v10h12V10h-2M12 3v12M8.5 6.5 12 3l3.5 3.5"/>'),
    plus: svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>'),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
    dots: svg('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'),
    phone: svg('<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8v6M9.5 11.5 12 14l2.5-2.5"/>'),
    download: svg('<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/>')
  };
  let installPrompt = null;
  let instTab = isAndroid ? 'android' : 'ios';

  $('instPill').textContent = T.installPill;
  $('instTitle').textContent = T.installTitle;
  $('instText').textContent = T.installText;
  instTabIos.textContent = T.installIos;
  instTabAndroid.textContent = T.installAndroid;
  instInstallBtn.innerHTML = ICON.download;
  instInstallBtn.appendChild(document.createTextNode(T.installBtn));
  $('instOk').textContent = T.installOk;
  $('instSkip').textContent = T.installSkip;

  function renderInstall() {
    const android = instTab === 'android';
    const canPrompt = android && !!installPrompt;
    instTabIos.setAttribute('aria-selected', String(!android));
    instTabAndroid.setAttribute('aria-selected', String(android));
    instInstallBtn.hidden = !canPrompt;
    $('instOk').hidden = canPrompt;
    const steps = android ? (canPrompt ? T.androidStepsAlt : T.androidSteps) : T.iosSteps;
    const icons = android ? [ICON.dots, ICON.phone] : [ICON.share, ICON.plus, ICON.check];
    instSteps.textContent = '';
    steps.forEach((text, i) => {
      const li = document.createElement('li');
      const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
      const body = document.createElement('span');
      text.split('**').forEach((part, j) => {
        if (!part) return;
        if (j % 2) { const b = document.createElement('b'); b.textContent = part; body.appendChild(b); }
        else body.appendChild(document.createTextNode(part));
      });
      const ic = document.createElement('span'); ic.innerHTML = icons[i] || '';
      li.append(num, body, ic);
      instSteps.appendChild(li);
    });
  }
  function closeInstall() {
    installEl.hidden = true;
    startEl.hidden = false;
    $('startBtn').focus();
  }
  instTabIos.addEventListener('click', () => { instTab = 'ios'; renderInstall(); });
  instTabAndroid.addEventListener('click', () => { instTab = 'android'; renderInstall(); });
  $('instOk').addEventListener('click', closeInstall);
  $('instSkip').addEventListener('click', closeInstall);
  instInstallBtn.addEventListener('click', () => {
    if (!installPrompt) return;
    const p = installPrompt;
    installPrompt = null;
    p.prompt();
    p.userChoice.then((c) => { if (c && c.outcome === 'accepted') closeInstall(); else renderInstall(); }).catch(renderInstall);
  });
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installPrompt = e;
    if (!installEl.hidden) renderInstall();
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; if (!installEl.hidden) closeInstall(); });

  // csak telefonon, böngészőben – a telepített appban soha
  if ((isIos || isAndroid) && !isStandalone) {
    renderInstall();
    startEl.hidden = true;
    installEl.hidden = false;
  }

  function gameOver() {
    state = 'over';
    buzz([30, 40, 60]);
    const isRecord = score > best && score > 0;
    if (isRecord) {
      best = score;
      try { localStorage.setItem('dekazas-dfc-best', String(best)); } catch (e) {}
    }
    showBest();
    $('finalScore').textContent = score;
    $('overPill').textContent = isRecord ? T.record : T.over;
    $('overInfo').textContent = bestStreak >= 2 ? T.streak + ': ' + bestStreak : T.best + ': ' + best;
    recordResult(score, bestStreak);
    setTimeout(() => { overEl.hidden = false; refreshOverLeaderboard(); if (nickBox.hidden) $('againBtn').focus(); }, 450);
  }

  function update(dt) {
    if (state === 'ready' || state === 'menu') {
      const t = performance.now() / 1000;
      ball.y = restY() + Math.sin(t * 2.4) * 6;
      rotateBall(0.35, 0.6, 0, dt);
      return;
    }
    ball.vy += gravity() * dt;
    if (state === 'play') ball.vx += wind * dt;
    ball.vx *= Math.pow(0.6, dt);
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.spinX *= Math.pow(0.85, dt);
    rotateBall(ball.spinX, 0, ball.vx / ball.r, dt);

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.65; }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.65; }
    if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.4; }

    if (ball.y + ball.r >= groundY) {
      ball.y = groundY - ball.r;
      if (state === 'play') gameOver();
      ball.vy = -ball.vy * 0.35;
      ball.vx *= 0.7;
      if (Math.abs(ball.vy) < 40) ball.vy = 0;
    }
  }

  /* ---------- rajzolás ---------- */
  const C = BRAND.colors;

  function drawBackground() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    // stadion fotó a felső részen, a háttérbe olvadva
    const photoH = H * 0.62;
    if (stadiumReady) {
      const s = Math.max(W / stadium.width, photoH / stadium.height);
      const iw = stadium.width * s, ih = stadium.height * s;
      ctx.globalAlpha = 0.5;
      ctx.drawImage(stadium, (W - iw) / 2, 0, iw, ih);
      ctx.globalAlpha = 1;
    }
    const fade = ctx.createLinearGradient(0, 0, 0, photoH);
    fade.addColorStop(0, 'rgba(12,30,44,0.55)');
    fade.addColorStop(0.55, 'rgba(12,30,44,0.35)');
    fade.addColorStop(1, C.bg);
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, W, photoH + 1);

    // gyep: sötét, finom csíkok a pálya felé
    const pitchTop = H * 0.62;
    const stripe = Math.max(28, (groundY - pitchTop) / 5);
    for (let y = pitchTop, i = 0; y < groundY; y += stripe, i++) {
      ctx.fillStyle = i % 2 ? 'rgba(0,115,122,0.10)' : 'rgba(0,115,122,0.04)';
      ctx.fillRect(0, y, W, Math.min(stripe, groundY - y));
    }
    const pitchFade = ctx.createLinearGradient(0, pitchTop - 40, 0, pitchTop + 60);
    pitchFade.addColorStop(0, C.bg);
    pitchFade.addColorStop(1, 'rgba(12,30,44,0)');
    ctx.fillStyle = pitchFade;
    ctx.fillRect(0, pitchTop - 40, W, 100);
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, 'rgba(0,115,122,0.22)');
    g.addColorStop(1, 'rgba(0,115,122,0.06)');
    ctx.fillStyle = g;
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(0, groundY, W, 2);
  }

  function drawShadow() {
    const height = Math.max(0, groundY - (ball.y + ball.r));
    const k = Math.max(0.25, 1 - height / (H * 0.8));
    ctx.fillStyle = 'rgba(0,0,0,' + (0.4 * k).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(ball.x, groundY - 2, ball.r * 0.9 * k, ball.r * 0.2 * k, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------- 3D labda: csonkolt ikozaéder (klasszikus focilabda) ---------- */
  function vnorm(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function vdot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function vcross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function vlerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function arc(a, b, n) { const out = []; for (let k = 0; k <= n; k++) out.push(vnorm(vlerp(a, b, k / n))); return out; }

  const BALL_GEO = (function () {
    const p = (1 + Math.sqrt(5)) / 2;
    const raw = [[0,1,p],[0,1,-p],[0,-1,p],[0,-1,-p],[1,p,0],[1,-p,0],[-1,p,0],[-1,-p,0],[p,0,1],[p,0,-1],[-p,0,1],[-p,0,-1]];
    const V = raw.map(vnorm);
    const nb = V.map((v, i) => V.map((u, j) => [j, vdot(u, v)]).filter((e) => e[0] !== i).sort((a, b) => b[1] - a[1]).slice(0, 5).map((e) => e[0]));
    const pents = [], seams = [];
    V.forEach((v, i) => {
      const t1 = vnorm(vlerp(V[nb[i][0]], v, 0).map((x, k) => x - v[k] * vdot(V[nb[i][0]], v)));
      const t2 = vcross(v, t1);
      const corners = nb[i].map((j) => vnorm(vlerp(v, V[j], 1 / 3)))
        .sort((a, b) => Math.atan2(vdot(a, t2), vdot(a, t1)) - Math.atan2(vdot(b, t2), vdot(b, t1)));
      let outline = [];
      for (let k = 0; k < 5; k++) {
        const seg = arc(corners[k], corners[(k + 1) % 5], 4);
        seams.push(seg);
        outline = outline.concat(seg.slice(0, -1));
      }
      pents.push({ c: v, outline });
      nb[i].forEach((j) => { if (j > i) seams.push(arc(vnorm(vlerp(v, V[j], 1 / 3)), vnorm(vlerp(v, V[j], 2 / 3)), 4)); });
    });
    return { pents, seams };
  })();

  let M = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  function rotateBall(wx, wy, wz, dt) {
    const w = Math.hypot(wx, wy, wz);
    const th = w * dt;
    if (th < 1e-6) return;
    const x = wx / w, y = wy / w, z = wz / w;
    const c = Math.cos(th), s = Math.sin(th), t = 1 - c;
    const R = [t*x*x + c, t*x*y - s*z, t*x*z + s*y,
               t*x*y + s*z, t*y*y + c, t*y*z - s*x,
               t*x*z - s*y, t*y*z + s*x, t*z*z + c];
    const N = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      N[i*3+j] = R[i*3] * M[j] + R[i*3+1] * M[3+j] + R[i*3+2] * M[6+j];
    const r0 = vnorm([N[0], N[1], N[2]]);
    let r1 = [N[3], N[4], N[5]];
    const d = vdot(r0, r1);
    r1 = vnorm([r1[0] - r0[0] * d, r1[1] - r0[1] * d, r1[2] - r0[2] * d]);
    const r2 = vcross(r0, r1);
    M = [r0[0], r0[1], r0[2], r1[0], r1[1], r1[2], r2[0], r2[1], r2[2]];
  }
  rotateBall(0.7, 0.4, 0.2, 1);

  function xf(p) {
    return [M[0]*p[0] + M[1]*p[1] + M[2]*p[2], M[3]*p[0] + M[4]*p[1] + M[5]*p[2], M[6]*p[0] + M[7]*p[1] + M[8]*p[2]];
  }
  function proj(p, r) {
    const q = xf(p);
    if (q[2] < 0) { const l = Math.hypot(q[0], q[1]) || 1; return [q[0] / l * r, q[1] / l * r]; }
    return [q[0] * r, q[1] * r];
  }

  function drawBall() {
    const r = ball.r;
    ctx.save();
    ctx.translate(ball.x, ball.y);

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = '#f6f7f4';
    ctx.fill();

    ctx.save();
    ctx.clip();

    ctx.fillStyle = C.kit;
    for (const pg of BALL_GEO.pents) {
      if (xf(pg.c)[2] < -0.3) continue;
      ctx.beginPath();
      pg.outline.forEach((pt, i) => { const q = proj(pt, r); if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]); });
      ctx.closePath();
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(20,32,38,0.3)';
    ctx.lineWidth = Math.max(0.8, r * 0.024);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const line of BALL_GEO.seams) {
      let open = false;
      for (const pt of line) {
        const q = xf(pt);
        if (q[2] > 0.02) {
          if (open) ctx.lineTo(q[0] * r, q[1] * r); else ctx.moveTo(q[0] * r, q[1] * r);
          open = true;
        } else open = false;
      }
    }
    ctx.stroke();

    // gömb árnyékolás: sötétedő perem, puha fény, csillanás
    const limb = ctx.createRadialGradient(-r * 0.15, -r * 0.2, r * 0.35, 0, 0, r * 1.02);
    limb.addColorStop(0, 'rgba(12,30,44,0)');
    limb.addColorStop(0.75, 'rgba(12,30,44,0.18)');
    limb.addColorStop(1, 'rgba(12,30,44,0.55)');
    ctx.fillStyle = limb;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    const soft = ctx.createRadialGradient(-r * 0.38, -r * 0.42, 0, -r * 0.38, -r * 0.42, r * 0.7);
    soft.addColorStop(0, 'rgba(255,255,255,0.45)');
    soft.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = soft;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    const spec = ctx.createRadialGradient(-r * 0.42, -r * 0.46, 0, -r * 0.42, -r * 0.46, r * 0.16);
    spec.addColorStop(0, 'rgba(255,255,255,0.85)');
    spec.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = spec;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    ctx.restore();

    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, r - 0.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    update(dt / 2); update(dt / 2);
    drawBackground();
    drawGround();
    drawShadow();
    drawBall();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker registration failed', e));
  });
}
</script>
